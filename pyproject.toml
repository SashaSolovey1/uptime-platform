[project]
name = "uptime-platform"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SashaSolovey1", email = "solo160103@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "httpx2>=2.12.0",
]

[project.scripts]
uptime-platform = "uptime_platform:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
