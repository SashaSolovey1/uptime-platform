services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uptime}
      POSTGRES_USER: ${POSTGRES_USER:-uptime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-uptime} -d ${POSTGRES_DB:-uptime}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${APP_IMAGE:-sashastudent/uptime-platform:latest}
    restart: "no"

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uptime}:${POSTGRES_PASSWORD:-uptime}@postgres:5432/${POSTGRES_DB:-uptime}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-5}

    command:
      - alembic
      - upgrade
      - head

    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${APP_IMAGE:-sashastudent/uptime-platform:latest}
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uptime}:${POSTGRES_PASSWORD:-uptime}@postgres:5432/${POSTGRES_DB:-uptime}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-5}

    command:
      - fastapi
      - run
      - src/uptime_platform/main.py
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    image: ${APP_IMAGE:-sashastudent/uptime-platform:latest}
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uptime}:${POSTGRES_PASSWORD:-uptime}@postgres:5432/${POSTGRES_DB:-uptime}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-5}

    command:
      - python
      - -m
      - uptime_platform.scheduler.main

    depends_on:
      migrate:
        condition: service_completed_successfully

  notification-worker:
    image: ${APP_IMAGE:-sashastudent/uptime-platform:latest}
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uptime}:${POSTGRES_PASSWORD:-uptime}@postgres:5432/${POSTGRES_DB:-uptime}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-5}

    command:
      - python
      - -m
      - uptime_platform.notifications.main

    depends_on:
      migrate:
        condition: service_completed_successfully

  postgres-test:
    image: postgres:17-alpine

    profiles:
      - test

    environment:
      POSTGRES_DB: uptime_test
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime

    ports:
      - "127.0.0.1:5433:5432"

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U uptime -d uptime_test"
        ]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: